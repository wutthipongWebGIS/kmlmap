<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WebGIS KML Map - Pattani</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, "Tahoma", sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #header {
            height: 60px;
            background: #1f4e79;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 20px;
            flex-shrink: 0;
        }

        #header h1 {
            margin: 0;
            font-size: 20px;
        }

        #status {
            font-size: 13px;
            opacity: 0.9;
        }

        #content {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        #sidebar {
            width: 300px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #sidebar h2 {
            font-size: 17px;
            margin-top: 0;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .layer-item input {
            width: 17px;
            height: 17px;
        }

        .button {
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f5f5f5;
            cursor: pointer;
        }

        .button:hover {
            background: #e8e8e8;
        }

        #map {
            flex: 1;
            min-width: 0;
            min-height: 0;
        }

        #message {
            padding: 8px;
            margin-top: 10px;
            border-radius: 5px;
            background: #f5f5f5;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {

            #content {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                height: 220px;
                border-right: 0;
                border-bottom: 1px solid #ddd;
            }

            #map {
                height: calc(100% - 220px);
            }
        }
    </style>
</head>

<body>

<div id="app">

    <header id="header">

        <h1>WebGIS KML Map</h1>

        <span id="status">
            Pattani / Thailand
        </span>

    </header>

    <div id="content">

        <aside id="sidebar">

            <h2>ชั้นข้อมูล KML / KMZ</h2>

            <button class="button"
                    onclick="showAllLayers()">
                แสดงทั้งหมด
            </button>

            <button class="button"
                    onclick="hideAllLayers()">
                ซ่อนทั้งหมด
            </button>

            <div id="layerList"></div>

            <div id="message">
                กำลังเตรียมแผนที่...
            </div>

        </aside>

        <main id="map"></main>

    </div>

</div>

<!--
    Google Maps API

    IMPORTANT:
    เปลี่ยน YOUR_GOOGLE_MAPS_API_KEY
    เป็น API Key ของคุณ
-->
<script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=geometry">
</script>

<script src="app.js"></script>

</body>
</html>
